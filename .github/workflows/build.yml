name: Build ESP32 Wi-Fi Toolkit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Configure ESP32 package index
        run: |
          set -euo pipefail
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://espressif.github.io/arduino-esp32/package_esp32_index.json
          for attempt in 1 2 3 4 5; do
            if arduino-cli core update-index; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "ESP32 package index could not be downloaded after 5 attempts."
              exit 1
            fi
            echo "Index update failed (attempt $attempt/5); retrying..."
            sleep $((attempt * 10))
          done

      - name: Install ESP32 core
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if arduino-cli core install esp32:esp32@3.0.7; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ESP32 core installation failed after 3 attempts."
              exit 1
            fi
            echo "Core installation failed (attempt $attempt/3); retrying..."
            sleep $((attempt * 10))
          done

      - name: Prepare Arduino sketch directory
        run: |
          set -euo pipefail
          rm -rf .ci/ESP32_WiFi_Security_Toolkit build
          mkdir -p .ci/ESP32_WiFi_Security_Toolkit build
          cp *.ino *.h .ci/ESP32_WiFi_Security_Toolkit/

      - name: Compile sketch and create complete flash image
        run: |
          set -euo pipefail
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --warnings all \
            --output-dir build \
            .ci/ESP32_WiFi_Security_Toolkit

          # Arduino-ESP32 names the merged image from the actual sketch filename.
          # Do not hard-code the basename: CLI/core versions can emit
          # <sketch>.ino.merged.bin or another valid *.merged.bin name.
          MERGED="$(find build -maxdepth 1 -type f -name '*.merged.bin' -size +0c | head -n 1)"
          if [ -z "$MERGED" ]; then
            echo "ERROR: Arduino-ESP32 did not produce a merged flash image."
            echo "Build directory contents:"
            find build -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

          # Make the complete image unmistakable for manual flashing.
          cp -f "$MERGED" "build/ESP32_WiFi_Security_Toolkit_FLASH_0x0.bin"

          echo "Complete flash image: build/ESP32_WiFi_Security_Toolkit_FLASH_0x0.bin"
          echo "Flash it at 0x0 (not 0x1000 or 0x10000)."
          echo "The image contains bootloader, partition table, boot_app0 and application."

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-wifi-toolkit-firmware
          path: |
            build/ESP32_WiFi_Security_Toolkit_FLASH_0x0.bin
